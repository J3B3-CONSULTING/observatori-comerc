name: Actualitzacio diaria de dades

on:
    schedule:
      - cron: '0 6 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:                                                                                                                                                                                                                                                                         
    update-data:                                            
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v6
                                                                                                                                                                                                                                                                                
        - name: Setup Python
          uses: actions/setup-python@v6                                                                                                                                                                                                                                         
          with:                                             
            python-version: '3.11'

        - name: Install dependencies                                                                                                                                                                                                                                            
          run: |
            pip install -r requirements.txt                                                                                                                                                                                                                                     
            pip install openpyxl                            

        - name: Fetch and process data
          run: |
            cd $GITHUB_WORKSPACE
            python -m data.processor

        - name: Commit updated data
          run: |
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'                                                                                                                                                                                                
            git add data/cache
            git diff --staged --quiet || git commit -m "Actualitzacio trimestral de dades $(date +%Y-%m-%d)"                                                                                                                                                                    
            git pull --rebase                                                                                                                                                                                                                                                   
            git push

        # Després del commit: si una font canvia una etiqueta de territori o branca,
        # migrate.py falla i el job surt vermell, però les dades del dashboard ja són desades.
        - name: Build DuckDB (capa de dades pel chatbot)
          run: |
            cd $GITHUB_WORKSPACE
            python data/sql/migrate.py

        # El motor escriu data/cache/fets.csv, que llegeix el snapshot del newsletter.
        - name: Commit fets
          run: |
            git add data/cache/fets.csv
            git diff --staged --quiet || git commit -m "Fets del motor $(date +%Y-%m-%d)"
            git pull --rebase
            git push
